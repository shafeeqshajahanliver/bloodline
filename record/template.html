<meta charset="utf-8">
<title>Bloodline Record</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a ledger of 100 films (one row each, still, year, title, completeness bar, source marks) that opens into a full record page per film. Bloodline design system: paper, ink, one red; one theme by decision; radius 0. */
:root{
  --paper:#f7f3ea; --soft:#ece6d9; --hair:#d3cbb8; --rule:#e2dbcb; --ink:#17110e; --mute:#6b6052; --red:#9e2b22; --on-ink:#faf7f0; --teal:#00836d; --ochre:#a97400; --plum:#8c2d63;
  --display:"Libre Caslon Text", Georgia, serif;
  --text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", monospace;
  color-scheme:light;
}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--hair)}
a:hover{border-bottom-color:var(--ink)}
.wrap{padding-inline:16px;padding-block:0 64px;max-width:1240px;margin-inline:auto}
header.bar{display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--hair)}
.wordmark{font-family:var(--display);font-size:22px;line-height:1;border:0;cursor:pointer;background:none;padding:0}
.crumb{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
.spacer{flex:1}
.overline{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
.tag.red{color:var(--red)}
.fp{font-style:italic;color:var(--mute)}
.btn{font-size:14.5px;letter-spacing:.02em;background:var(--paper);border:1px solid var(--ink);padding:5px 14px;cursor:pointer;border-radius:0}
.btn:hover{background:var(--soft)}
.linkish{all:unset;cursor:pointer;border-bottom:1px solid var(--hair)}
.linkish:hover{border-bottom-color:var(--ink)}
.linkish:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* index */
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 40px;align-items:end;padding-block:36px 22px}
.intro h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.05;margin:6px 0 0;text-wrap:balance}
.intro p{max-width:62ch;margin:12px 0 0;color:var(--ink)}
.intro .totals{display:flex;gap:28px}
.totals .n{font-family:var(--mono);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.totals .l{font-size:13px;color:var(--mute);margin-top:4px}
.controls{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding-block:12px;display:grid;gap:10px}
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search input{flex:1;min-width:0;max-width:520px;border:1px solid var(--ink);background:var(--paper);padding:7px 10px;border-radius:0;font-size:16px}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center}
.chips .lab{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute);margin-right:4px;min-width:62px}
.chip{font-size:14px;border:1px solid var(--hair);background:var(--paper);padding:2px 9px;cursor:pointer;border-radius:0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip .k{font-family:var(--mono);font-size:11.5px;color:inherit;opacity:.7;margin-left:4px}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px;font-size:13.5px;color:var(--mute)}
.key{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.key span{display:inline-flex;gap:6px;align-items:center}
ol.ledger{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:128px 52px minmax(0,1fr) 170px 118px;gap:18px;align-items:center;padding-block:10px;border-top:1px solid var(--rule);cursor:pointer}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.thumb{width:128px;aspect-ratio:16/9;background-color:var(--soft);background-repeat:no-repeat;background-size:100% auto;position:relative}
.thumb.none{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mute);background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--paper) 6px 12px)}
.row .yr{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.row .ti{font-family:var(--display);font-size:20px;line-height:1.2}
.row .sub{font-size:13.5px;color:var(--mute);margin-top:2px}
.row .hits{font-size:13px;margin-top:4px}
.row .hits b{font-weight:600}
.bar10{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:14px}
.bar10 i{display:block;background:var(--ink)}
.bar10 i.ns{background:repeating-linear-gradient(135deg,var(--hair) 0 2px,var(--paper) 2px 5px);outline:1px solid var(--hair);outline-offset:-1px}
.bar10 i.no{background:var(--paper);outline:1px solid var(--hair);outline-offset:-1px}
.bar10 i.thin{background:var(--mute)}
.marks{display:flex;gap:3px}
.marks b{font-family:var(--mono);font-weight:400;font-size:11.5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink)}
.marks b.on{background:var(--ink);color:var(--on-ink)}
.marks b.off{border-color:var(--hair);color:var(--hair)}
.empty{padding:40px 0;font-family:var(--display);font-style:italic;color:var(--mute);font-size:18px}

/* record */
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;font-size:14.5px}
.head{padding-block:18px 0}
.work{font-family:var(--display);font-size:54px;line-height:1.05;font-weight:400;margin:6px 0 0;text-wrap:balance}
.dbl{border:0;border-top:3px solid var(--ink);margin:14px 0 0;height:4px;border-bottom:1px solid var(--ink)}
.meta{font-family:var(--mono);font-size:13px;color:var(--mute);margin:10px 0 0;letter-spacing:.03em}
.lede{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.35;margin:18px 0 0;max-width:46ch}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
.frame{width:100%;aspect-ratio:16/9;background-color:var(--soft);background-repeat:no-repeat;background-size:100% auto}
.frame.none{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mute);font-style:italic;background:repeating-linear-gradient(135deg,var(--soft) 0 8px,var(--paper) 8px 16px)}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.strip button{all:unset;cursor:pointer;aspect-ratio:16/9;background-repeat:no-repeat;background-size:100% auto;background-color:var(--soft);outline-offset:-2px}
.strip button[aria-current="true"]{outline:2px solid var(--ink)}
.strip button:focus-visible{outline:2px solid var(--red)}
.caption{font-size:12.5px;color:var(--mute);margin-top:6px}
.complete h4,.side h4{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute);margin:0 0 8px;text-transform:uppercase}
.complete .bar10{height:22px}
.complete .labels{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:4px}
.complete .labels span{font-size:10.5px;line-height:1.2;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg);height:58px;text-align:left;white-space:nowrap}
.complete .note{font-size:13px;color:var(--mute);margin-top:8px}
.srcs{margin-top:20px;display:grid;gap:6px}
.srcs div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.srcs .marks b{width:20px}
.body > *,.hero > *{min-width:0}
.body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:48px;margin-top:40px}
section.dim{margin-top:34px}
section.dim:first-child{margin-top:0}
.dim h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.dim .q2{font-size:14px;color:var(--mute);margin:2px 0 10px;font-style:italic}
.entry{padding:10px 0;border-top:1px solid var(--rule)}
.entry .v{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
.entry .v strong{font-weight:600;font-size:16.5px}
.entry .det{font-size:15px;margin-top:2px}
.entry blockquote{margin:6px 0 0;padding:0 0 0 12px;border-left:2px solid var(--hair);font-size:14px;line-height:1.5;color:var(--mute)}
.entry blockquote .from{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;margin-right:6px;color:var(--ink)}
.ns{font-family:var(--display);font-style:italic;color:var(--mute);font-size:16px;padding:8px 0;border-top:1px solid var(--rule)}
.when5{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);margin-top:6px}
.when5 span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:4px 0 0;border-left:1px solid var(--hair);padding-left:6px}
.when5 span:first-child{border-left:0;padding-left:0}
ol.beats{list-style:none;margin:0;padding:0;counter-reset:b}
ol.beats li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
ol.beats .no{font-family:var(--mono);font-size:14px;color:var(--mute);padding-top:2px}
.pos{height:4px;background:var(--rule);margin-top:6px;position:relative;max-width:260px}
.pos i{position:absolute;top:-2px;height:8px;width:20%;background:var(--ink)}
.imgfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
details.plot{margin-top:40px;border-top:3px solid var(--ink)}
details.plot summary{cursor:pointer;font-family:var(--display);font-size:26px;padding-block:12px 4px;list-style-position:outside}
details.plot .ptext{max-width:68ch}
details.plot .ptext p{margin:0 0 12px}
.side{display:grid;gap:28px;align-content:start}
.side section{border-top:1px solid var(--ink);padding-top:10px}
dl.facts{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14.5px}
dl.facts dt{color:var(--mute);font-size:13px}
dl.facts dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat .n{font-family:var(--mono);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.stat .l{font-size:12.5px;color:var(--mute)}
ul.plain{list-style:none;padding:0;margin:0;font-size:14.5px}
ul.plain li{padding:6px 0;border-top:1px solid var(--rule)}
ul.plain li:first-child{border-top:0}
.small{font-size:13px;color:var(--mute)}
.arch .nm{font-family:var(--display);font-size:17px}
.foot{font-size:12.5px;color:var(--mute);margin-top:48px;line-height:1.5;border-top:1px solid var(--hair);padding-top:12px;max-width:80ch}

/* film page visuals */
.blockhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-top:3px solid var(--ink);padding-top:10px;margin-top:44px}
.blockhead h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.blockhead p{margin:0;font-size:14px;color:var(--mute);max-width:60ch}
.glance{margin:12px 0 0;min-width:0}
.glance svg{display:block;width:100%;overflow:visible}
.glance svg text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.glance svg text.rowlab{font-family:var(--text);font-size:12.5px;fill:var(--ink)}
.glance svg .mk{cursor:pointer}
.glance svg .mk:hover circle,.glance svg .mk:hover rect,.glance svg .mk.on circle,.glance svg .mk.on rect{stroke:var(--red);stroke-width:2}
.readout{min-height:48px;margin:10px 0 0;padding:8px 0 0;border-top:1px solid var(--rule);font-size:15px}
.readout .tag{margin-right:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:13px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px}
.spec{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-left:1px solid var(--hair);border-top:1px solid var(--hair);margin-top:12px}
.cell{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);cursor:pointer;min-height:132px;min-width:0}
.cell:hover{background:var(--soft)}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.cell .cl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.cell .cv{font-family:var(--display);font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.cell .cn{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:auto}
.cell.empty{background:repeating-linear-gradient(135deg,var(--paper) 0 7px,var(--soft) 7px 9px)}
.cell.empty .cv{font-style:italic;color:var(--mute);font-size:16px}
.cell .mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.cell .mini i{width:8px;height:8px;display:block}
.cell .zones{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-items:end;height:34px}
.cell .zones i{display:block;background:var(--ink)}
.tones{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:4px;height:14px}
.tones button{all:unset;cursor:pointer;display:block}
.tones button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.among{display:grid;gap:16px;margin-top:6px}
.am .lab{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.am .lab b{font-family:var(--mono);font-weight:700;font-size:15px}
.am .track{position:relative;height:22px;margin-top:2px;border-bottom:1px solid var(--hair)}
.am .track i{position:absolute;bottom:0;width:1px;height:9px;background:var(--hair)}
.am .track i.med{height:14px;background:var(--mute)}
.am .track b{position:absolute;bottom:-5px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--red)}
.am .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:6px}
.am.none .lab b{color:var(--mute);font-weight:400;font-size:13px}
.ringwrap{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:8px}
.ringwrap svg{width:100%;height:auto;display:block}
.ringwrap svg text{font-family:var(--text);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.ringwrap svg text.rl{font-family:var(--mono);font-size:11px;fill:var(--mute);letter-spacing:.06em}
.ringwrap .small{max-width:36ch}
.matrix{overflow-x:auto;margin-bottom:10px}
.matrix table{border-collapse:collapse;width:100%;min-width:420px}
.matrix th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 6px;border-bottom:1px solid var(--ink)}
.matrix td{border-bottom:1px solid var(--rule);padding:0;vertical-align:middle}
.matrix td.rn{font-size:14px;padding:6px 8px 6px 0;white-space:nowrap}
.matrix td.rn .sw{margin-right:6px}
.matrix td button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;gap:3px;width:100%;min-height:30px;padding:6px;align-content:center}
.matrix td button:hover{background:var(--soft)}
.matrix td button[aria-pressed="true"]{background:var(--soft);outline:1px solid var(--ink);outline-offset:-1px}
.matrix td button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.matrix td button i{width:10px;height:10px;display:block}
.entry{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:4px 28px;scroll-margin-top:24px}
.entry .quotes blockquote:first-child{margin-top:2px}
.entry.flash{background:var(--soft)}
ol.beats li{scroll-margin-top:24px}
ol.beats li.flash{background:var(--soft)}

/* story-first layout */
.story8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:1px solid var(--hair);border-top:1px solid var(--hair);margin-top:14px}
.story8 .cell{min-height:150px;gap:4px}
.story8 .vals{display:flex;flex-direction:column;gap:3px}
.story8 .vals > span{font-family:var(--display);font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.story8 .vals > span:first-child{font-size:22px}
.story8 .vals > span+span{color:var(--mute);font-size:16px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
.icard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--hair);background:var(--soft);padding:12px 14px 14px;min-width:0}
.icard:hover{background:var(--rule)}
.icard:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.icard .role{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.icard .iv{font-family:var(--display);font-size:24px;line-height:1.15;overflow-wrap:anywhere}
.icard .st{font-size:14px;font-style:italic;color:var(--mute)}
.icard .dt{font-size:13.5px;line-height:1.45}
.icard .wbar{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:auto;padding-top:8px}
.icard .wbar i{height:4px;background:var(--hair)}
.icard .wbar i.on{background:var(--ink)}
.icard .wl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--mute)}
ol.beatseq{list-style:none;margin:14px 0 0;padding:0;columns:2 340px;column-gap:40px}
ol.beatseq li{break-inside:avoid;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--rule)}
ol.beatseq li button{all:unset;cursor:pointer;font-family:var(--display);font-size:18px;line-height:1.3}
ol.beatseq li button:hover{text-decoration:underline;text-decoration-color:var(--hair)}
ol.beatseq li button:focus-visible{outline:2px solid var(--ink)}
ol.beatseq .no{font-family:var(--mono);font-size:13px;color:var(--mute);padding-top:3px}
ol.beatseq .tag{margin-left:6px}
.filmband{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-top:14px;align-items:start}
@media (max-width:980px){ .story8{grid-template-columns:repeat(2,minmax(0,1fr))} .filmband{grid-template-columns:1fr} }
@media (max-width:620px){ .tray{grid-template-columns:1fr 1fr;gap:8px} .icard .iv{font-size:19px} .story8 .vals > span:first-child{font-size:19px} }
@media (max-width:980px){ .spec{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:620px){ .entry{grid-template-columns:1fr} .ringwrap{grid-template-columns:1fr} .cell{min-height:110px} }
@media (max-width:980px){
  .row{grid-template-columns:96px 46px minmax(0,1fr);gap:12px}
  .thumb{width:96px}
  .row .bar10,.row .marks{grid-column:3}
  .row .bar10{max-width:200px}
  .body{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
}
@media (max-width:620px){
  .intro{grid-template-columns:1fr;padding-block:24px 16px}
  .intro h1{font-size:34px}
  .work{font-size:36px}
  .row{grid-template-columns:84px minmax(0,1fr)}
  .thumb{width:84px;grid-row:span 3}
  .row .yr{display:none}
  .row .bar10,.row .marks{grid-column:2}
  .strip{grid-template-columns:repeat(4,1fr)}
  .chips .lab{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <button class="wordmark" id="home" type="button">Bloodline</button>
    <span class="crumb" id="crumb">the record · 100 films · release 1</span>
    <span class="spacer"></span>
    <span class="tag">first pass · unreviewed</span>
  </header>
  <main id="app"></main>
</div>

<script id="idx" type="application/json">__INDEX__</script>
<script>
const IDX = JSON.parse(document.getElementById("idx").textContent);
const F = IDX.films, ARCH = IDX.arch;
const DIMS = ["threat","origin","wants","wrong","trigger","rules","who_suffers","ending","images","beats"];
const DN = {threat:"Threat",origin:"Origin",wants:"What it wants",wrong:"The wrong underneath",trigger:"Trigger",rules:"Rules",who_suffers:"Who suffers",ending:"Ending",images:"Images",beats:"Beats"};
const DQ = {threat:"What is the danger?",origin:"Where did it come from?",wants:"What drives it?",wrong:"What past act sits underneath?",trigger:"What sets the story off?",rules:"How does it work, and how can it be stopped?",who_suffers:"Who is endangered, and how are they tied to the threat?",ending:"How does it resolve?",images:"Concrete images, with when they appear and what they do.",beats:"Key events in order."};
const SHORT = {threat:"Threat",origin:"Origin",wants:"Wants",wrong:"Wrong",trigger:"Trigger",rules:"Rules",who_suffers:"Suffers",ending:"Ending",images:"Images",beats:"Beats"};
const WHEN = ["opening","early","middle","late","ending"];
const ERAS = [["<1960",0,1959],["1960s–70s",1960,1979],["1980s–90s",1980,1999],["2000–14",2000,2014],["2015+",2015,9999]];
const REGIONS = [...new Set(F.map(f => f.r))];
const PRIMED = ["vengeful ghost","serial killer","cult","possessing demon","person who died wronged","summoned by ritual","revenge","hunger","moving into a new home","must not look","cycle passes on","threat survives","threat destroyed","ambiguous","everyone dies","victim becomes threat","made by someone","unexplained","from nature","from outside","inherited"];
const primed = v => PRIMED.some(p => v === p || new RegExp("\\b" + p.replace(/s$/, "") + "s?\\b").test(v));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "" : n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "m" : "$" + Math.round(n / 1e3) + "k";
const app = document.getElementById("app");
const cache = {};
const state = { q: "", region: new Set(), era: new Set(), has: new Set(), sort: "year" };
try { const s = JSON.parse(localStorage.getItem("bl-r1") || "{}"); if (s.sort) state.sort = s.sort; } catch (e) {}

function eraOf(y) { return ERAS.find(e => y >= e[1] && y <= e[2])[0]; }
function bar(f) {
  return `<span class="bar10" role="img" aria-label="${f.f.length} of 10 story dimensions filled">${DIMS.map(k =>
    `<i class="${f.f.includes(k) ? (f.pq === "thin" ? "thin" : "") : f.ns.includes(k) ? "ns" : "no"}" title="${DN[k]}${f.f.includes(k) ? "" : f.ns.includes(k) ? ": not stated in the plot" : ": empty"}"></i>`).join("")}</span>`;
}
const MARKS = [["P","plot","Wikipedia plot"],["S","sub","English subtitles"],["C","sp","Screenplay"],["J","sc","Jump-scare timings"],["V","st","Stills"]];
function marks(f) {
  return `<span class="marks">${MARKS.map(([l, k, n]) => { const on = k === "plot" ? true : !!f[k];
    return `<b class="${on ? "on" : "off"}" title="${n}${on ? "" : ": none"}">${l}</b>`; }).join("")}</span>`;
}
function thumb(f, cls) {
  if (!f.st) return `<span class="${cls} none">NO STILLS</span>`;
  return `<span class="${cls}" style="background-image:url('stills/${f.id}.jpg');background-size:100% ${f.st * 100}%;background-position:0 0"></span>`;
}

/* ---------- index ---------- */
function matches(f) {
  if (state.region.size && !state.region.has(f.r)) return null;
  if (state.era.size && !state.era.has(eraOf(f.y))) return null;
  for (const h of state.has) if (!f[h]) return null;
  const q = state.q.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/);
  const hay = [f.t, f.c, f.r, String(f.y), ...f.dir, ...f.cast, ...f.a.map(a => ARCH[a]?.name || "")].join(" ").toLowerCase();
  const hits = f.v.filter(v => terms.every(t => v.includes(t)));
  if (terms.every(t => hay.includes(t))) return hits;
  return hits.length ? hits : null;
}
function renderIndex() {
  document.title = "Bloodline Record";
  document.getElementById("crumb").textContent = "the record · 100 films · release 1";
  const counts = k => F.filter(f => f[k]).length;
  app.innerHTML = `
  <div class="intro">
    <div>
      <p class="overline">Release 1 · the record</p>
      <h1>One hundred horror films, read element by element</h1>
      <p>Each film is described along ten story dimensions, every entry quoted from its Wikipedia plot, subtitles or screenplay. The wording is the reader's own and has not been merged or reviewed. Search covers titles, people and every story element.</p>
    </div>
    <div class="totals">
      <div><div class="n">100</div><div class="l">films</div></div>
      <div><div class="n">${F.reduce((a, f) => a + f.n, 0).toLocaleString("en-GB")}</div><div class="l">story entries</div></div>
      <div><div class="n">${new Set(F.map(f => f.c)).size}</div><div class="l">countries</div></div>
    </div>
  </div>
  <div class="controls">
    <div class="search"><input id="q" type="search" placeholder="Search a title, a director, or an element like dog, mirror, drowned" value="${esc(state.q)}" aria-label="Search films and story elements">
      <span class="chips"><span class="lab">SORT</span>${[["year","Year"],["title","Title"],["n","Most entries"]].map(([k, n]) => `<button class="chip" type="button" data-sort="${k}" aria-pressed="${state.sort === k}">${n}</button>`).join("")}</span></div>
    <div class="chips"><span class="lab">REGION</span>${REGIONS.map(r => `<button class="chip" type="button" data-region="${esc(r)}" aria-pressed="${state.region.has(r)}">${esc(r)}<span class="k">${F.filter(f => f.r === r).length}</span></button>`).join("")}</div>
    <div class="chips"><span class="lab">ERA</span>${ERAS.map(([e]) => `<button class="chip" type="button" data-era="${e}" aria-pressed="${state.era.has(e)}">${e}<span class="k">${F.filter(f => eraOf(f.y) === e).length}</span></button>`).join("")}</div>
    <div class="chips"><span class="lab">HAS</span>${[["st","Stills"],["sp","Screenplay"],["sc","Jump scares"],["osub","Original-language subtitles"],["pl","Pilot lineage"]].map(([k, n]) => `<button class="chip" type="button" data-has="${k}" aria-pressed="${state.has.has(k)}">${n}<span class="k">${counts(k)}</span></button>`).join("")}</div>
  </div>
  <div class="status"><span id="count"></span>
    <span class="key"><span><span class="bar10" style="width:30px;grid-template-columns:repeat(3,1fr)"><i></i><i class="ns"></i><i class="no"></i></span> filled · not stated · empty</span>
    <span>${marks({sub:1,sp:1,sc:1,st:1})} plot · subtitles · screenplay · jumps · stills</span></span></div>
  <ol class="ledger" id="ledger"></ol>`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value; renderRows(); });
  app.querySelectorAll("[data-region]").forEach(b => b.onclick = () => toggle(state.region, b.dataset.region, b));
  app.querySelectorAll("[data-era]").forEach(b => b.onclick = () => toggle(state.era, b.dataset.era, b));
  app.querySelectorAll("[data-has]").forEach(b => b.onclick = () => toggle(state.has, b.dataset.has, b));
  app.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    state.sort = b.dataset.sort; try { localStorage.setItem("bl-r1", JSON.stringify({ sort: state.sort })); } catch (e) {}
    app.querySelectorAll("[data-sort]").forEach(x => x.setAttribute("aria-pressed", x === b)); renderRows(); });
  renderRows();
}
function toggle(set, v, b) { set.has(v) ? set.delete(v) : set.add(v); b.setAttribute("aria-pressed", set.has(v)); renderRows(); }
function renderRows() {
  let list = F.map(f => [f, matches(f)]).filter(x => x[1]);
  const s = state.sort;
  list.sort((a, b) => s === "title" ? a[0].t.localeCompare(b[0].t) : s === "n" ? b[0].n - a[0].n : a[0].y - b[0].y || a[0].t.localeCompare(b[0].t));
  document.getElementById("count").textContent = `${list.length} of 100 films`;
  const L = document.getElementById("ledger");
  if (!list.length) { L.innerHTML = `<li class="empty">No films match. Clear a filter or try another word.</li>`; return; }
  L.innerHTML = list.map(([f, hits]) => `<li class="row" tabindex="0" role="link" data-id="${f.id}" aria-label="${esc(f.t)}, ${f.y}">
    ${thumb(f, "thumb")}
    <span class="yr">${f.y}</span>
    <span><div class="ti">${esc(f.t)}</div><div class="sub">${esc(f.c)}${f.dir.length ? " · " + esc(f.dir.join(", ")) : ""}</div>
      ${hits.length ? `<div class="hits"><span class="tag">matches</span> ${hits.slice(0, 5).map(h => `<b>${esc(h)}</b>`).join(", ")}${hits.length > 5 ? ` <span class="tag">+${hits.length - 5}</span>` : ""}</div>` : ""}</span>
    ${bar(f)}
    ${marks(f)}
  </li>`).join("");
  L.querySelectorAll(".row").forEach(r => {
    r.onclick = () => go(r.dataset.id);
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(r.dataset.id); } };
  });
}

/* ---------- record ---------- */
function go(id) { location.hash = id; }
async function load(id) {
  if (!cache[id]) cache[id] = fetch(`data/${id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return cache[id];
}
function from(e) {
  const s = e.source || "wikipedia";
  if (s === "subtitles") return `<span class="from">subtitles ${esc(e.at || "")}</span>`;
  if (s === "screenplay") return `<span class="from">screenplay</span>`;
  return `<span class="from">wikipedia</span>`;
}
function quotes(e) {
  let h = `<blockquote>${from(e)}“${esc(e.quote)}”</blockquote>`;
  for (const m of e.moments || []) h += `<blockquote>${from(m)}“${esc(m.quote)}”</blockquote>`;
  return h;
}
function tags(e, k) {
  const t = [];
  if (k === "who_suffers" && e.relation_to_threat) t.push(`<span class="tag">${esc(e.relation_to_threat)}</span>`);
  if (k === "images") { if (e.role) t.push(`<span class="tag">${esc(e.role)}</span>`); if (e.state) t.push(`<span class="tag">${esc(e.state)}</span>`); }
  if ((k === "images") && e.when) t.push(`<span class="tag">${esc(e.when)}</span>`);
  if (e.confidence === "observed") t.push(`<span class="tag">observed</span>`);
  if (e.source && e.source !== "wikipedia") t.push(`<span class="tag">added from ${esc(e.source)}</span>`);
  if (primed(e.value)) t.push(`<span class="tag red" title="This wording was one of the examples given to the readers, so it may be over-used.">example wording</span>`);
  return t.join(" ");
}

const ROLE_C = {omen:"var(--red)",threat:"var(--plum)",clue:"var(--teal)",symbol:"var(--ochre)",weapon:"var(--ink)",trigger:"var(--ink)",turn:"var(--ochre)",mirror:"var(--teal)",setting:"var(--mute)"};
const HOLLOW = new Set(["trigger","turn","mirror"]);
const ZONE = {opening:[0,.08],early:[.08,.3],middle:[.3,.7],late:[.7,.9],ending:[.9,1]};
const RELS = ["self","family","lover","community","stranger","unknown"];
const RELN = {self:"the self",family:"family",lover:"lovers",community:"community",stranger:"strangers",unknown:"unknown"};
const swatch = r => { const c = ROLE_C[r] || "var(--hair)"; return HOLLOW.has(r) ? `background:var(--paper);box-shadow:inset 0 0 0 2px ${c}` : `background:${c}`; };
function tsec(s) { const m = /^(\d\d):(\d\d):(\d\d)/.exec(s || ""); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] : null; }
function timeOf(e) { if (e.source === "subtitles") return tsec(e.at); const m = (e.moments || []).find(m => m.source === "subtitles" && m.at); return m ? tsec(m.at) : null; }
function sortedBeats(d) { return (d.dims.beats || []).map((e, i) => ({ ...e, _i: i })).sort((a, b) => (a.order ?? 999) - (b.order ?? 999)); }

function specimen(d) {
  return `<div class="spec">${DIMS.map(k => {
    const es = d.dims[k] || [], ns = d.not_stated.includes(k);
    if (!es.length) return `<button type="button" class="cell empty" data-jump="d-${k}"><span class="cl">${DN[k]}</span><span class="cv">${ns ? "Not stated in the plot" : "Nothing recorded"}</span></button>`;
    let extra = "", head = esc(es[0].value);
    if (k === "images") { head = `${es.length} images`; extra = `<span class="mini">${[...es].sort((a, b) => (a.role || "").localeCompare(b.role || "")).map(e => `<i style="${swatch(e.role)}" title="${esc(e.value)}"></i>`).join("")}</span>`; }
    if (k === "beats") { const z = WHEN.map(w => es.filter(e => e.when === w).length), mx = Math.max(...z, 1); head = `${es.length} beats`;
      extra = `<span class="zones" title="Beats per part of the film: ${WHEN.map((w, i) => w + " " + z[i]).join(", ")}">${z.map(n => `<i style="height:${n ? 4 + n / mx * 30 : 1}px;${n ? "" : "background:var(--hair)"}"></i>`).join("")}</span>`; }
    if (k === "who_suffers") extra = `<span class="cn" style="margin-top:0">${[...new Set(es.map(e => e.relation_to_threat).filter(Boolean))].map(r => RELN[r]).join(" · ")}</span>`;
    return `<button type="button" class="cell" data-jump="d-${k}"><span class="cl">${DN[k]}</span><span class="cv">${head}</span>${extra}<span class="cn">${k === "images" || k === "beats" ? "" : es.length > 1 ? `+${es.length - 1} more` : "1 entry"}</span></button>`;
  }).join("")}</div>`;
}

function among(f) {
  const M = [["rt", "Runtime", v => Math.round(v) + " min"], ["wpm", "Words a minute", v => Math.round(v)], ["ds", "Runtime with dialogue", v => Math.round(v * 100) + "%"], ["nsc", "Jump scares logged", v => v], ["n", "Story entries", v => v]];
  return `<div class="among">${M.map(([k, name, fm]) => {
    const vals = F.map(x => x[k]).filter(v => v != null).sort((a, b) => a - b);
    if (f[k] == null) return `<div class="am none"><div class="lab"><span>${name}</span><b>no data</b></div></div>`;
    const lo = vals[0], hi = vals[vals.length - 1], pos = v => hi === lo ? 50 : (v - lo) / (hi - lo) * 100, med = vals[Math.floor(vals.length / 2)];
    return `<div class="am"><div class="lab"><span>${name}</span><b>${fm(f[k])}</b></div>
      <div class="track" role="img" aria-label="${name}: ${fm(f[k])}, against a range of ${fm(lo)} to ${fm(hi)} across ${vals.length} films">${vals.map(v => `<i style="left:${pos(v)}%"></i>`).join("")}<i class="med" style="left:${pos(med)}%" title="median ${fm(med)}"></i><b style="left:${pos(f[k])}%"></b></div>
      <div class="ends"><span>${fm(lo)}</span><span>median ${fm(med)}</span><span>${fm(hi)}</span></div></div>`;
  }).join("")}</div>`;
}

function glanceBlock(d) {
  return `<div class="blockhead"><h3>The film at a glance</h3><p>Dialogue, jump scares, story beats and images laid along the running time. Point at or tap a mark to read it.</p></div>
    <figure class="glance" id="glance" aria-label="Timeline of ${esc(d.title)}"></figure>
    <p class="readout" id="readout"><span class="fp">Point at a mark to read it here. Click it to jump to its entry.</span></p>
    <div class="legend"><span><span class="sw" style="background:var(--mute)"></span>words spoken each minute</span><span><span class="sw" style="background:var(--soft);outline:1px solid var(--hair)"></span>longest silences</span><span><span class="sw" style="background:var(--red);width:2px;height:12px"></span>jump scare</span>
      <span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="var(--ink)"/></svg>timed from subtitles</span><span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="var(--paper)" stroke="var(--ink)"/></svg>placed by part of the film</span>
      ${["omen","clue","threat","symbol","weapon","setting"].map(r => `<span><span class="sw" style="${swatch(r)}"></span>${r}</span>`).join("")}</div>`;
}
function drawGlance(d) {
  const el = document.getElementById("glance"); if (!el) return;
  const W = el.clientWidth, narrow = W < 640, L = narrow ? 10 : 96, iw = W - L - 12;
  const series = d.wpm_series || [], sc = d.scares ? d.scares.scares.map(s => tsec(s.t)).filter(v => v != null) : [];
  const beats = sortedBeats(d), imgs = (d.dims.images || []).map((e, i) => ({ ...e, _i: i }));
  const timed = [...beats, ...imgs].map(timeOf).filter(v => v != null);
  const T = Math.max(d.runtime || 0, series.length, ...sc.map(v => v / 60 + 1), ...timed.map(v => v / 60 + 1), 10);
  const x = m => L + m / T * iw;
  const place = (items) => { // exact time when known, otherwise spread inside its part of the film
    const out = []; const byZone = {};
    items.forEach(e => { const t = timeOf(e); if (t != null) out.push([e, t / 60, true]); else if (ZONE[e.when]) (byZone[e.when] = byZone[e.when] || []).push(e); });
    for (const [w, es] of Object.entries(byZone)) { const [a, b] = ZONE[w]; es.forEach((e, j) => out.push([e, T * (a + (b - a) * (j + .5) / es.length), false])); }
    return out.sort((p, q) => p[1] - q[1]);
  };
  const lanes = (pl, gap, n) => { const last = Array(n).fill(-1e9); return pl.map(p => { const px = x(p[1]); let l = last.findIndex(v => px - v >= gap); if (l < 0) l = last.indexOf(Math.min(...last)); last[l] = px; return [...p, l]; }); };
  const rowH = { dia: 52, sc: 22, beats: 46, img: 40 }, lab = narrow ? 18 : 0;
  let y = 0, h = "";
  const row = (name, H) => { const top = y + lab; h += narrow ? `<text class="rowlab" x="0" y="${y + 12}">${name}</text>` : `<text class="rowlab" x="0" y="${top + H / 2 + 4}">${name}</text>`; y = top + H + 10; return top; };
  // zones background
  const zoneTop = 0;
  // dialogue
  let top = row("Dialogue", rowH.dia);
  const en = d.dialogue.en;
  if (en) for (const s of en.longest_silences || []) { const a = tsec(s.starts_at) / 60; h += `<rect x="${x(a)}" y="${top}" width="${Math.max(2, s.seconds / 60 / T * iw)}" height="${rowH.dia}" fill="var(--soft)" stroke="var(--hair)"/>`; }
  if (series.length) { const bw = Math.max(1, iw / T - 1); series.forEach((n, m) => { const bh = Math.min(n, 240) / 240 * rowH.dia; if (bh > 0) h += `<rect x="${x(m)}" y="${top + rowH.dia - bh}" width="${bw}" height="${bh}" fill="var(--mute)"/>`; }); }
  else h += `<text x="${L}" y="${top + rowH.dia / 2 + 4}">no usable English subtitles</text>`;
  h += `<line x1="${L}" x2="${L + iw}" y1="${top + rowH.dia}" y2="${top + rowH.dia}" stroke="var(--hair)"/>`;
  // scares
  top = row("Jump scares", rowH.sc);
  if (sc.length) d.scares.scares.forEach(s => { const t = tsec(s.t); if (t == null) return; h += `<g class="mk" data-tip="${esc(`<span class="tag">jump scare · ${s.t}</span>${s.d}`)}"><rect x="${x(t / 60) - 4}" y="${top - 2}" width="8" height="${rowH.sc + 4}" fill="transparent"/><line x1="${x(t / 60)}" x2="${x(t / 60)}" y1="${top}" y2="${top + rowH.sc}" stroke="var(--red)" stroke-width="2"/></g>`; });
  else h += `<text x="${L}" y="${top + 15}">${d.scares ? "none logged" : "no jump-scare log for this film"}</text>`;
  // beats
  top = row("Beats", rowH.beats);
  lanes(place(beats), 20, 2).forEach(([e, m, ex, l]) => { const n = beats.indexOf(e) + 1, cx = x(m), cy = top + 11 + l * 22;
    h += `<g class="mk" data-jump="b-${e._i}" data-tip="${esc(`<span class="tag">beat ${n} · ${e.when || ""}${ex ? " · " + (e.at || (e.moments || []).find(q => q.source === "subtitles").at) : ""}</span><strong>${e.value}</strong>${e.detail ? " · " + e.detail : ""}`)}"><circle cx="${cx}" cy="${cy}" r="9.5" fill="${ex ? "var(--ink)" : "var(--paper)"}" stroke="var(--ink)"/><text x="${cx}" y="${cy + 3.5}" text-anchor="middle" style="fill:${ex ? "var(--on-ink)" : "var(--ink)"};font-size:10px">${n}</text></g>`; });
  // images
  top = row("Images", rowH.img);
  lanes(place(imgs), 11, 3).forEach(([e, m, ex, l]) => { const cx = x(m), cy = top + 6 + l * 12, c = ROLE_C[e.role] || "var(--hair)", hol = HOLLOW.has(e.role);
    h += `<g class="mk" data-jump="i-${e._i}" data-tip="${esc(`<span class="tag">image · ${e.role || "no role"} · ${e.when || ""}${ex ? " · timed" : ""}</span><strong>${e.value}</strong>${e.state ? " · " + e.state : ""}${e.detail ? " · " + e.detail : ""}`)}"><rect x="${cx - 4.5}" y="${cy - 4.5}" width="9" height="9" fill="${hol ? "var(--paper)" : c}" stroke="${c}" stroke-width="${hol ? 2 : 1}" ${ex ? "" : `stroke-dasharray="${hol ? "" : ""}"`}/></g>`; });
  // axis and parts of the film
  const ax = y;
  const step = T > 150 ? 30 : T > 70 ? 15 : 10;
  h += `<line x1="${L}" x2="${L + iw}" y1="${ax}" y2="${ax}" stroke="var(--ink)"/>`;
  for (let m = 0; m <= T; m += step) h += `<line x1="${x(m)}" x2="${x(m)}" y1="${ax}" y2="${ax + 5}" stroke="var(--ink)"/><text x="${x(m)}" y="${ax + 17}" text-anchor="${m === 0 ? "start" : "middle"}">${m === 0 ? "0 min" : m}</text>`;
  for (const w of WHEN) { const [a, b] = ZONE[w]; h += `<line x1="${x(T * a)}" x2="${x(T * a)}" y1="0" y2="${ax}" stroke="var(--rule)" stroke-dasharray="2 3"/>`;
    if (!narrow || (b - a) > .15) h += `<text x="${x(T * (a + b) / 2)}" y="${ax + 34}" text-anchor="middle" style="letter-spacing:.08em">${w.toUpperCase()}</text>`; }
  const H = ax + 42;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Timeline of dialogue, jump scares, beats and images">${h}</svg>`;
  const ro = document.getElementById("readout");
  el.querySelectorAll(".mk").forEach(g => {
    const show = () => { el.querySelectorAll(".mk.on").forEach(o => o.classList.remove("on")); g.classList.add("on"); ro.innerHTML = g.dataset.tip; };
    g.addEventListener("mouseenter", show);
    g.addEventListener("click", () => { show(); if (g.dataset.jump) flash(g.dataset.jump); });
  });
}
function flash(id) {
  const t = document.getElementById(id); if (!t) return;
  if (t.parentElement && t.parentElement.hidden) t.parentElement.hidden = false;
  t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1600);
}

function rings(d) {
  const es = d.dims.who_suffers || []; if (!es.length) return "";
  const present = RELS.filter(r => es.some(e => e.relation_to_threat === r));
  const S = 320, c = S / 2, R = i => 34 + i * 24;
  let h = `<circle cx="${c}" cy="${c}" r="9" fill="var(--red)"/><text x="${c}" y="${c + 24}" text-anchor="middle" class="rl">THREAT</text>`;
  RELS.forEach((r, i) => { const on = present.includes(r); if (r === "unknown" && !on) return;
    h += `<circle cx="${c}" cy="${c}" r="${R(i)}" fill="none" stroke="${on ? "var(--ink)" : "var(--rule)"}" stroke-width="${on ? 1 : 1}" ${on ? "" : `stroke-dasharray="2 3"`}/>`;
    h += `<text x="${c}" y="${c - R(i) + 3.5}" text-anchor="middle" class="rl" style="${on ? "fill:var(--ink)" : ""}">${r.toUpperCase()}</text>`; });
  const placed = es.filter(e => RELS.includes(e.relation_to_threat));
  placed.forEach((e, j) => { const i = RELS.indexOf(e.relation_to_threat), a = (-60 + (j + .5) * 300 / placed.length) * Math.PI / 180 + Math.PI / 2 * 0,
      ang = a, px = c + R(i) * Math.sin(ang + Math.PI * 0.18), py = c - R(i) * Math.cos(ang + Math.PI * 0.18);
    const right = px >= c, lx = px + (right ? 10 : -10);
    h += `<circle cx="${px}" cy="${py}" r="5" fill="var(--ink)"/><text x="${lx}" y="${py + 4}" text-anchor="${right ? "start" : "end"}">${esc(e.value)}</text>`; });
  return `<div class="ringwrap"><svg viewBox="-90 0 ${S + 180} ${S}" role="img" aria-label="Who suffers, by closeness to the threat: ${placed.map(e => e.value + " (" + e.relation_to_threat + ")").join(", ")}">${h}</svg>
    <p class="small">Rings run from the threat outward: the self, family, lovers, community, strangers. Solid rings are the ones this film uses. ${present.length ? `Here the danger falls on ${present.map(r => RELN[r]).join(", ")}.` : ""}</p></div>`;
}
function matrix(es) {
  const roles = [...new Set(es.map(e => e.role || "none"))].sort((a, b) => es.filter(e => (e.role || "none") === b).length - es.filter(e => (e.role || "none") === a).length);
  return `<div class="matrix"><table><thead><tr><th>Role</th>${WHEN.map(w => `<th>${w}</th>`).join("")}</tr></thead><tbody>${roles.map(r => `<tr><td class="rn"><span class="sw" style="${swatch(r)}"></span>${esc(r)}</td>${WHEN.map(w => { const n = es.filter(e => (e.role || "none") === r && e.when === w);
      return `<td>${n.length ? `<button type="button" data-cell="${esc(r)}|${w}" aria-pressed="false" aria-label="${n.length} ${esc(r)} images, ${w}">${n.map(e => `<i style="${swatch(r)}" title="${esc(e.value)}"></i>`).join("")}</button>` : ""}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="imgfilter"><button class="chip" type="button" id="imgall" aria-pressed="true">Show all ${es.length} images</button><span class="small" id="imgnote">Click a square group to show only those images.</span></div>`;
}


const S8 = ["threat","wants","trigger","wrong","origin","rules","who_suffers","ending"];
function story8(d) {

    const es = d.dims[k] || [], ns = d.not_stated.includes(k);
    if (!es.length) return `<button type="button" class="cell empty" data-jump="d-${k}"><span class="cl">${DN[k]}</span><span class="cv">${ns ? "Not stated in the plot" : "Nothing recorded"}</span></button>`;

    return `<button type="button" class="cell" data-jump="d-${k}"><span class="cl">${DN[k]}</span><span class="vals">${shown.map(e => `<span>${esc(e.value)}${k === "who_suffers" && e.relation_to_threat ? ` <span class="tag">${esc(e.relation_to_threat)}</span>` : ""}</span>`).join("")}</span>${es.length > 3 ? `<span class="cn">+${es.length - 3} more</span>` : ""}</button>`;

}
function tray(d) {

      <span class="role" style="color:${c === "var(--hair)" ? "var(--mute)" : c}">${esc(e.role || "image")}${e.source && e.source !== "wikipedia" ? ` · from ${esc(e.source)}` : ""}</span>
      <span class="iv">${esc(e.value)}</span>${e.state ? `<span class="st">${esc(e.state)}</span>` : ""}${e.detail ? `<span class="dt">${esc(e.detail)}</span>` : ""}
      <span class="wbar" aria-label="appears in the ${esc(e.when || "")} part">${WHEN.map(w => `<i class="${w === e.when ? "on" : ""}"></i>`).join("")}</span><span class="wl"><span>start</span><span>${esc(e.when || "")}</span><span>end</span></span></button>`; }).join("")}</div>`;

function beatseq(d) {

}

function entry(e, k, id) {

function dimSection(d, k) {

    body = `<ol class="beats">${sorted.map((e, i) => `<li id="b-${e._i}"><span class="no">${i + 1}</span><div><div class="v" style="display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline"><strong style="font-weight:600">${esc(e.value)}</strong>${e.when ? `<span class="tag">${esc(e.when)}</span>` : ""}${e.role ? `<span class="tag">${esc(e.role)}</span>` : ""}${e.source && e.source !== "wikipedia" ? `<span class="tag">added from ${esc(e.source)}</span>` : ""}${primed(e.value) ? `<span class="tag red">example wording</span>` : ""}</div>
      ${e.when && WHEN.includes(e.when) ? `<div class="pos" aria-hidden="true"><i style="left:${WHEN.indexOf(e.when) * 20}%"></i></div>` : ""}
      ${e.detail ? `<div class="det" style="font-size:15px;margin-top:4px">${esc(e.detail)}</div>` : ""}${quotes(e)}</div></li>`).join("")}</ol>`;
  } else if (k === "images") {
    body = matrix(es) + `<div id="imglist">${es.map((e, i) => ({ ...e, _i: i })).sort((a, b) => WHEN.indexOf(a.when) - WHEN.indexOf(b.when)).map(e => `<div data-r="${esc(e.role || "none")}" data-w="${esc(e.when || "")}">${entry(e, k, "i-" + e._i)}</div>`).join("")}</div>`;
  } else body = (k === "who_suffers" ? rings(d) : "") + es.map(e => entry(e, k)).join("");
  return `<section class="dim" id="d-${k}"><h2>${DN[k]}</h2><p class="q2">${DQ[k]}</p>${body}</section>`;
}
function stillsBlock(d) {

  const n = d.stills, pos = i => n === 1 ? "0 0" : `0 ${(i / (n - 1)) * 100}%`;
  return `<div class="frame" id="frame" role="img" aria-label="Still from ${esc(d.title)}" style="background-image:url('stills/${d.id}.jpg');background-size:100% ${n * 100}%;background-position:${pos(0)}"></div>
    ${n > 1 ? `<div class="strip">${Array.from({ length: n }, (_, i) => `<button type="button" aria-label="Show still ${i + 1} of ${n}" aria-current="${i === 0}" data-i="${i}" style="background-image:url('stills/${d.id}.jpg');background-size:100% ${n * 100}%;background-position:${pos(i)}"></button>`).join("")}</div>` : ""}
    ${(d.tones || []).length > 1 ? `<div class="tones" aria-label="Prevailing colour of each still">${d.tones.map((c, i) => `<button type="button" data-i="${i}" style="background:${c}" aria-label="Show still ${i + 1}" title="${c}"></button>`).join("")}</div>` : ""}
    <div class="caption">${n} stills from <a href="${esc(d.stills_source)}" target="_blank" rel="noopener">FILMGRAB</a>, in the order they appear on the page, not necessarily the film's order.</div>`;

function sources(d, f) {

  const en = d.dialogue.en;
  return `<div class="srcs">
    ${row("P", !!d.plot, d.plot ? `Wikipedia plot${d.plot.lang !== "en" ? ` (${esc(d.plot.lang)} article)` : ""}${d.plot_quality === "thin" ? ", thin" : ""}` : "No plot")}
    ${row("S", !!en, en ? "English subtitles" : "No usable English subtitles")}
    ${row("C", !!d.script, d.script ? `Screenplay, ${esc(d.script.site || "")}` : "No screenplay")}
    ${row("J", !!d.scares, d.scares ? `${d.scares.scares.length} jump scares logged` : "No jump-scare log")}

function side(d) {
  const L = d.links, en = d.dialogue.en, other = Object.keys(d.dialogue).filter(l => l !== "en");
  const fact = (k, v) => v && (!Array.isArray(v) || v.length) ? `<dt>${k}</dt><dd>${esc(Array.isArray(v) ? v.join(", ") : v)}</dd>` : "";
  let h = `<section><h4>Facts</h4><dl class="facts">
    ${fact("Directed by", d.directors)}${fact("Written by", d.writers)}${fact("Starring", d.cast)}${fact("Camera", d.dop)}${fact("Music", d.music)}${fact("Produced by", d.producers)}
    ${fact("Countries", d.countries)}${fact("Languages", d.languages)}${fact("Set in", d.set_in)}${fact("Shot in", d.shot_in)}${fact("Subjects", d.subjects)}

  h += `<section class="arch"><h4>Archetypes · first pass</h4><ul class="plain">${d.arch.map((c, i) => `<li><div class="nm">${esc(ARCH[c]?.name || c)}</div><div class="small">${i === 0 ? "Primary" : "Secondary"} · ${esc(ARCH[c]?.beat || "")}</div><div class="small">Roots: ${esc(ARCH[c]?.roots || "")}</div></li>`).join("")}</ul>

  }
  if (d.scares) h += `<section><h4>Jump scares</h4><div class="stats"><div class="stat"><div class="n">${d.scares.scares.length}</div><div class="l">logged</div></div>${d.scares.rating != null ? `<div class="stat"><div class="n">${d.scares.rating}</div><div class="l">jumpiness, out of 5</div></div>` : ""}</div>

    <p class="small" style="margin:8px 0 0">${d.script.note ? esc(d.script.note) + " " : ""}A draft from <a href="${esc(d.script.source)}" target="_blank" rel="noopener">${esc(d.script.site)}</a>; it can differ from the finished film. Heading counts are approximate.</p></section>`;

  h += `<section><h4>Elsewhere</h4><ul class="plain">${[["Wikipedia", L.wikipedia], ["Wikidata", L.wikidata], ["IMDb", L.imdb], ["Letterboxd", L.letterboxd]].filter(x => x[1]).map(([n, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${n}</a></li>`).join("")}</ul></section>`;
  return h;
}
