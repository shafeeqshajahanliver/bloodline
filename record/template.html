<meta charset="utf-8">
<title>Bloodline Record</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Caslon+Text:ital,wght@0,400;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: a graph (or ledger) of the films that opens into a record per film. Direction: a night archive. Warm black, bone type set in an old printed face, one blood red, film grain over everything, stills that flicker up out of the dark. One dark theme by decision; radius 0. */
:root{
  --paper:#0c0a09; --soft:#1a1513; --hair:#3a302a; --rule:#231c19; --ink:#e9e1d1; --mute:#9a8e7d; --red:#cf3a2e; --on-ink:#0c0a09; --teal:#3fb39a; --ochre:#d1a23c; --plum:#c0609a;
  --display:"IM Fell English", "Libre Caslon Text", Georgia, serif;
  --text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"Courier Prime", "Courier New", monospace;
  color-scheme:dark;
}
body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55;margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--hair)}
a:hover{border-bottom-color:var(--ink)}
.wrap{padding-inline:16px;padding-block:0 64px;max-width:1240px;margin-inline:auto}
header.bar{display:flex;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--hair)}
.wordmark{font-family:var(--display);font-size:22px;line-height:1;border:0;cursor:pointer;background:none;padding:0}
.crumb{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.04em}
.spacer{flex:1}
.overline{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums}
.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
.tag.red{color:var(--red)}
.fp{font-style:italic;color:var(--mute)}
.btn{font-size:14.5px;letter-spacing:.02em;background:var(--paper);border:1px solid var(--ink);padding:5px 14px;cursor:pointer;border-radius:0}
.btn:hover{background:var(--soft)}
.linkish{all:unset;cursor:pointer;border-bottom:1px solid var(--hair)}
.linkish:hover{border-bottom-color:var(--ink)}
.linkish:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* index */
.controls{margin-top:18px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding-block:12px;display:grid;gap:10px}
.search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* the toolbar stays quiet: hairline rules and borders, muted type, the current view only lightly marked */
.controls{border-top:1px solid var(--hair) !important;border-bottom:1px solid var(--hair) !important;padding-block:10px !important}
.controls .filterbtn,.controls .search input,.controls .viewtoggle{border-color:var(--hair)}
.controls .filterbtn{background:transparent;color:var(--mute);font-size:14px;padding:6px 12px}.controls .filterbtn:hover{color:var(--ink);background:transparent}
.controls .search input{background:transparent;font-size:15px;padding:6px 10px}
.controls .viewtoggle button{color:var(--mute);font-size:14px}.controls .viewtoggle button:hover{color:var(--ink)}
.controls .viewtoggle button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.search input{flex:1;min-width:0;max-width:520px;border:1px solid var(--ink);background:var(--paper);padding:7px 10px;border-radius:0;font-size:16px}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center}
.chips .lab{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute);margin-right:4px;min-width:62px}
.chip{font-size:14px;border:1px solid var(--hair);background:var(--paper);padding:2px 9px;cursor:pointer;border-radius:0}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip .k{font-family:var(--mono);font-size:11.5px;color:inherit;opacity:.7;margin-left:4px}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px;font-size:13.5px;color:var(--mute)}
.key{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.key span{display:inline-flex;gap:6px;align-items:center}
ol.ledger{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:center;padding-block:10px;border-top:1px solid var(--rule);cursor:pointer}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.thumb{width:128px;aspect-ratio:16/9;background-color:var(--soft);background-repeat:no-repeat;background-size:100% auto;position:relative}
.thumb.none{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mute);background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--paper) 6px 12px)}
.row .yr{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.row .ti{font-family:var(--display);font-size:20px;line-height:1.2}
.row .sub{font-size:13.5px;color:var(--mute);margin-top:2px}
.row .hits{font-size:13px;margin-top:4px}
.row .hits b{font-weight:600}
.marks{display:flex;gap:3px}
.marks b{font-family:var(--mono);font-weight:400;font-size:11.5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border:1px solid var(--ink)}
.marks b.on{background:var(--ink);color:var(--on-ink)}
.marks b.off{border-color:var(--hair);color:var(--hair)}
.empty{padding:40px 0;font-family:var(--display);font-style:italic;color:var(--mute);font-size:18px}

/* record */
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;font-size:14.5px}
.head{padding-block:18px 0}
.work{font-family:var(--display);font-size:54px;line-height:1.05;font-weight:400;margin:6px 0 0;text-wrap:balance}
.dbl{border:0;border-top:3px solid var(--ink);margin:14px 0 0;height:4px;border-bottom:1px solid var(--ink)}
.meta{font-family:var(--mono);font-size:13px;color:var(--mute);margin:10px 0 0;letter-spacing:.03em}
.nmline{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 0 0}
.nmline a.pl{font-family:var(--display);font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink);margin-left:10px;--uc:var(--ink)}
.fstats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.archvs{display:grid;gap:14px;margin-top:12px}
.archvs .avr{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center}
.archvs .avr .t{grid-column:1/-1;text-align:left;font-family:var(--display);font-size:16px;padding:0;margin:0 0 2px;border:0;justify-self:start}
.archvs .bar{display:block;height:6px;background:var(--rule)}.archvs .bar i{display:block;height:100%;background:var(--lc);min-width:2px}
.archvs .bar.b i{background:transparent;border:1px solid var(--lc);box-sizing:border-box}
.archvs .bv{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:nowrap}
.frame{width:100%;aspect-ratio:16/9;background-color:var(--soft);background-repeat:no-repeat;background-size:100% auto}
.frame.none{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mute);font-style:italic;background:repeating-linear-gradient(135deg,var(--soft) 0 8px,var(--paper) 8px 16px)}
.caption{font-size:12.5px;color:var(--mute);margin-top:6px}
.side h4, .filmfacts h4{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--mute);margin:0 0 8px;text-transform:uppercase}
.srcs{margin-top:20px;display:grid;gap:6px}
.srcs div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.srcs .marks b{width:20px}
.body > *{min-width:0}
.body{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:48px;margin-top:40px}
section.dim{margin-top:34px}
section.dim:first-child{margin-top:0}
.dim h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.dim .q2{font-size:14px;color:var(--mute);margin:2px 0 10px;font-style:italic}
.entry{padding:10px 0;border-top:1px solid var(--rule)}
.entry .v{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
.entry .v strong{font-weight:600;font-size:16.5px}
.entry .det{font-size:15px;margin-top:2px}
.entry blockquote{margin:6px 0 0;padding:0 0 0 12px;border-left:2px solid var(--hair);font-size:14px;line-height:1.5;color:var(--mute)}
.entry blockquote .from{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;margin-right:6px;color:var(--ink)}
ol.beats{list-style:none;margin:0;padding:0;counter-reset:b}
ol.beats li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
ol.beats .no{font-family:var(--mono);font-size:14px;color:var(--mute);padding-top:2px}
.pos{height:4px;background:var(--rule);margin-top:6px;position:relative;max-width:260px}
.pos i{position:absolute;top:-2px;height:8px;width:20%;background:var(--ink)}
.imgfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
details.plot{margin-top:40px;border-top:3px solid var(--ink)}
details.plot summary{cursor:pointer;font-family:var(--display);font-size:26px;padding-block:12px 4px;list-style-position:outside}
details.plot .ptext{max-width:68ch}
details.plot .ptext p{margin:0 0 12px}
.side{display:grid;gap:28px;align-content:start}
.side section{border-top:1px solid var(--ink);padding-top:10px}
dl.facts{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:14.5px}
dl.facts dt{color:var(--mute);font-size:13px}
dl.facts dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat .n{font-family:var(--mono);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.stat .l{font-size:12.5px;color:var(--mute)}
ul.plain{list-style:none;padding:0;margin:0;font-size:14.5px}
ul.plain li{padding:6px 0;border-top:1px solid var(--rule)}
ul.plain li:first-child{border-top:0}
.small{font-size:13px;color:var(--mute)}
.arch .nm{font-family:var(--display);font-size:17px}
.foot{font-size:12.5px;color:var(--mute);margin-top:48px;line-height:1.5;border-top:1px solid var(--hair);padding-top:12px;max-width:80ch}

/* film page visuals */
.sw{display:inline-block;width:10px;height:10px}
.tones{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:4px;height:14px}
.tones button{all:unset;cursor:pointer;display:block}
.tones button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.among{display:grid;gap:16px;margin-top:6px}
.am .lab{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.am .lab b{font-family:var(--mono);font-weight:700;font-size:15px}
.am .track{position:relative;height:22px;margin-top:2px;border-bottom:1px solid var(--hair)}
.am .track i{position:absolute;bottom:0;width:1px;height:9px;background:var(--hair)}
.am .track i.med{height:14px;background:var(--mute)}
.am .track b{position:absolute;bottom:-5px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:var(--red)}
.am .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:6px}
.am.none .lab b{color:var(--mute);font-weight:400;font-size:13px}
.ringwrap{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:8px}
.ringwrap svg{width:100%;height:auto;display:block}
.ringwrap svg text{font-family:var(--text);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.ringwrap svg text.rl{font-family:var(--mono);font-size:11px;fill:var(--mute);letter-spacing:.06em}
.ringwrap .small{max-width:36ch}
.matrix{overflow-x:auto;margin-bottom:10px}
.matrix table{border-collapse:collapse;width:100%;min-width:420px}
.matrix th{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:left;padding:4px 6px;border-bottom:1px solid var(--ink)}
.matrix td{border-bottom:1px solid var(--rule);padding:0;vertical-align:middle}
.matrix td.rn{font-size:14px;padding:6px 8px 6px 0;white-space:nowrap}
.matrix td.rn .sw{margin-right:6px}
.matrix td button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-wrap:wrap;gap:3px;width:100%;min-height:30px;padding:6px;align-content:center}
.matrix td button:hover{background:var(--soft)}
.matrix td button[aria-pressed="true"]{background:var(--soft);outline:1px solid var(--ink);outline-offset:-1px}
.matrix td button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.matrix td button i{width:10px;height:10px;display:block}
.entry{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:4px 28px;scroll-margin-top:24px}
.entry .quotes blockquote:first-child{margin-top:2px}
.entry.flash{background:var(--soft)}
ol.beats li{scroll-margin-top:24px}
ol.beats li.flash{background:var(--soft)}

@media (max-width:620px){ .entry{grid-template-columns:1fr} .ringwrap{grid-template-columns:1fr} }

/* film page: still and story up top, the running time as the anchor, evidence below */
.top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:36px;margin-top:22px;align-items:start}
.frame{position:relative}
.thumbs{display:flex;gap:3px;margin-top:3px}
.thumbs button{all:unset;cursor:pointer;flex:1;aspect-ratio:16/10;background-repeat:no-repeat;background-color:var(--soft);position:relative;min-width:0}
.fpage .thumbs button::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:3px;background:var(--tone,transparent)}
.dna{display:flex;gap:3px;margin-top:3px;height:56px}
.dna button{all:unset;cursor:pointer;flex:1;min-width:0}
.dna button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.thumbs button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.thumbs button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.nostill{aspect-ratio:16/9;background:var(--soft);color:var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:28px 30px}
.nostill q{font-family:var(--display);font-style:italic;font-size:26px;line-height:1.3;quotes:"“" "”"}
.nostill span{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;opacity:.7;margin-top:14px}
.prose{font-family:var(--display);font-size:24px;line-height:1.5;margin:0;text-wrap:pretty}
.prose i{font-style:italic;color:var(--mute)}
.prose.syn{font-size:25px;line-height:1.5;color:var(--ink)}
.prose a.pl{color:var(--ink);text-decoration:underline;text-decoration-color:var(--uc,var(--hair));text-decoration-thickness:1px;text-underline-offset:5px;border:0}
.prose a.pl:hover{color:var(--uc,var(--ink))}
.prose button{all:unset;cursor:pointer;color:var(--ink);background-image:linear-gradient(var(--uc,var(--hair)),var(--uc,var(--hair)));background-size:100% 1px;background-repeat:no-repeat;background-position:0 92%}
.prose button:hover{background-image:linear-gradient(var(--red),var(--red))}
.prose button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.prose .rel{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--mute);vertical-align:2px}
.prose-note{font-size:13px;color:var(--mute);margin-top:14px}
.spinehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:56px}
.spinehead h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.spinehead p{margin:0;font-size:14px;color:var(--mute);max-width:56ch}
.spine{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.spine svg{display:block;overflow:visible}
.spine svg text{font-family:var(--mono);font-size:11px;fill:var(--mute)}
.spine svg .lbl text{font-family:var(--text);font-size:14.5px;fill:var(--ink)}
.spine svg .hit{cursor:pointer}
.spine svg .hit:focus{outline:none}
.spine svg .hit:hover .lb,.spine svg .hit:focus-visible .lb,.spine svg .hit.on .lb{fill:var(--soft)}
.spine svg .hit.on text{font-weight:600}
.spine svg .hit.on circle.bt{stroke:var(--red);stroke-width:2.5}
.spine svg .hit:focus-visible circle.bt{stroke:var(--red);stroke-width:2.5}
.keyline{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:6px;font-size:13px;color:var(--mute)}
.keyline span{display:inline-flex;align-items:center;gap:6px}
.detail{border-top:1px solid var(--hair);margin-top:14px;padding-top:16px;min-height:70px}
.detail .kind{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.detail h4{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;margin:6px 0 0;text-wrap:balance}
.detail .st{font-style:italic;color:var(--mute);margin-top:6px}
.detail .dt{margin-top:8px;max-width:48ch}
.detail .also{font-size:13.5px;color:var(--mute);margin-top:12px}
.detail .fearlink{margin-top:14px;font-family:var(--display);font-size:20px}
.detail blockquote{margin:0 0 10px;padding:0 0 0 14px;border-left:2px solid var(--hair);font-size:15px;line-height:1.5}
.detail blockquote .from{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;margin-right:6px;color:var(--mute)}
.reading{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:72px;border-top:3px solid var(--ink);padding-top:10px}
.reading h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.reading p{margin:0;font-size:14px;color:var(--mute)}
@media (max-width:980px){ .top{grid-template-columns:1fr} .detail{grid-template-columns:1fr} }
@media (max-width:620px){ .prose{font-size:20px} .detail h4{font-size:30px} .nostill q{font-size:20px} }

/* the film as a node */
.netwrap > *{min-width:0}
.netwrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:36px;margin-top:14px;align-items:start}
.netsvg{overflow-x:auto}
.netsvg svg{display:block;width:100%;min-width:520px;height:auto}
.netsvg text{font-family:var(--text);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.netsvg text.fl{font-family:var(--display);font-size:17px}
.netsvg text.ctr{font-family:var(--display);font-size:24px}
.netsvg text.ty{font-family:var(--mono);font-size:10px;fill:var(--mute);letter-spacing:.08em}
.netsvg .nd{cursor:pointer}
.netsvg .nd:focus{outline:none}
.netsvg .nd:focus-visible circle,.netsvg .nd:focus-visible rect,.netsvg .nd:focus-visible path{stroke:var(--red);stroke-width:2.5}
.netsvg.dim .ed{opacity:.08}.netsvg.dim .nd{opacity:.25}
.netsvg.dim .ed.hi{opacity:1}.netsvg.dim .nd.hi{opacity:1}
ol.why{list-style:none;margin:0;padding:0;counter-reset:w}
ol.why li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 0;border-top:1px solid var(--rule)}
ol.why li.hi{background:var(--soft)}
ol.why .no{font-family:var(--mono);font-size:12px;color:var(--mute);padding-top:4px}
ol.why .t{font-family:var(--display);font-size:18px}
ol.why .r{font-size:13.5px;color:var(--mute);margin-top:2px}
ol.why .r b{font-weight:600;color:var(--ink)}
.strength{display:inline-block;height:5px;background:var(--ink);vertical-align:middle;margin-left:8px}
.linkinfo{font-size:14px;margin-top:12px;min-height:22px}
@media (max-width:980px){ .netwrap{grid-template-columns:1fr} }

/* home graph */
.viewtoggle{display:inline-flex;border:1px solid var(--ink)}
.viewtoggle button{all:unset;cursor:pointer;padding:5px 16px;font-size:14.5px}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.viewtoggle button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.gstage{position:relative;height:min(82vh,880px);min-height:540px;border-bottom:1px solid var(--hair);overflow:hidden}
/* while the graph recomputes: the threads sink into the dark and flicker like a failing projector, and a single red eye
   opens in the middle, looks around and blinks. Transform and opacity only, so it keeps moving while the page is busy. */
.gbusy{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .45s}
.gbusy .geye{width:64px;height:30px;display:grid;place-items:center;animation:gopen 2.6s cubic-bezier(.6,0,.3,1) infinite;will-change:transform}
.gbusy .lid{width:34px;height:34px;border:1.5px solid var(--red);border-radius:80% 0;transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 18px rgba(207,58,46,.35)}
.gbusy .pupil{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);transform:rotate(-45deg);animation:glook 2.6s ease-in-out infinite;will-change:transform}
.gbusy .gbt{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);animation:gfade 2.6s ease-in-out infinite}
.gstage svg{transition:opacity .45s,filter .45s}
.gstage.busy .gbusy{opacity:1;transition:none}.gstage.busy svg{opacity:.18;filter:blur(2.5px);transition:none;animation:gflick 1.7s steps(1) infinite;will-change:opacity}
@keyframes gopen{0%{transform:scaleY(.06)}18%{transform:scaleY(1)}62%{transform:scaleY(1)}68%{transform:scaleY(.06)}74%{transform:scaleY(1)}100%{transform:scaleY(.06)}}
@keyframes glook{0%,20%{transform:rotate(-45deg) translate(0,0)}35%{transform:rotate(-45deg) translate(-7px,0)}55%{transform:rotate(-45deg) translate(7px,0)}70%,100%{transform:rotate(-45deg) translate(0,0)}}
@keyframes gfade{0%,100%{opacity:.25}50%{opacity:.8}}
@keyframes gflick{0%{opacity:.18}12%{opacity:.26}14%{opacity:.12}40%{opacity:.2}43%{opacity:.08}46%{opacity:.22}80%{opacity:.16}83%{opacity:.28}}
@media (prefers-reduced-motion: reduce){.gbusy .geye,.gbusy .pupil,.gbusy .gbt,.gstage.busy svg{animation:none}}

.gstage.hov .ge.hi{opacity:1}.gstage.hov .gn.hi{opacity:1}.gstage.hov text.lab.hi{opacity:1}

.smh{font-family:var(--display);font-size:22px;margin:0 0 10px}
.smk{margin-bottom:16px}
.smkl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.smv{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:9px;align-items:baseline;padding:5px 0;width:100%;font-size:16px;line-height:1.3;border-bottom:1px solid var(--rule)}
.smv .sw{flex:none;width:10px;height:10px;transform:translateY(1px)}
.smv em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--mute)}
.smv:hover,.smv.on{color:var(--c);border-bottom-color:var(--c)}
.smv:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.smn{font-style:italic;color:var(--mute);font-size:15px}
.sma{position:relative}
.sma::before{content:"";position:absolute;left:6px;right:8px;top:21px;height:1px;background:var(--hair)}
.sma::after{content:"";position:absolute;right:7px;top:17px;width:8px;height:8px;border-top:1px solid var(--hair);border-right:1px solid var(--hair);transform:rotate(45deg)}
@media (max-width:900px){ .smap{grid-template-columns:1fr} .sma{height:26px} .sma::before{left:50%;right:auto;top:2px;bottom:6px;width:1px;height:auto} .sma::after{left:calc(50% - 4px);right:auto;top:auto;bottom:6px;transform:rotate(135deg)} }
@media (max-width:980px){
  .row{grid-template-columns:96px minmax(0,1fr);gap:4px 14px}
  .thumb{width:96px;grid-row:span 3}
  .row .marks{grid-column:2}
  .body{grid-template-columns:1fr}
}
@media (max-width:620px){
  .work{font-size:36px}
  .row{grid-template-columns:84px minmax(0,1fr)}
  .thumb{width:84px;grid-row:span 3}
  .row .yr{display:none}
  .row .marks{grid-column:2}
  .chips .lab{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script id="idx" type="application/json">__INDEX__</script>
<script>
const IDX = JSON.parse(document.getElementById("idx").textContent);
const F = IDX.films, ARCH = IDX.arch;
const DIMS = ["threat","origin","wants","wrong","trigger","rules","who_suffers","ending","images","beats"];
const DN = {threat:"Threat",origin:"Origin",wants:"What it wants",wrong:"The wrong underneath",trigger:"Trigger",rules:"Rules",who_suffers:"Who suffers",ending:"Ending",images:"Symbols",beats:"Beats"};
const DQ = {threat:"What is the danger?",origin:"Where did it come from?",wants:"What drives it?",wrong:"What past act sits underneath?",trigger:"What sets the story off?",rules:"How does it work, and how can it be stopped?",who_suffers:"Who is endangered, and how are they tied to the threat?",ending:"How does it resolve?",images:"The symbols that recur: objects, animals, places, bodies, with when they appear and what they do.",beats:"Key events in order."};
const SHORT = {threat:"Threat",origin:"Origin",wants:"Wants",wrong:"Wrong",trigger:"Trigger",rules:"Rules",who_suffers:"Suffers",ending:"Ending",images:"Symbols",beats:"Beats"};
const WHEN = ["opening","early","middle","late","ending"];
const ERAS = [["<1960",0,1959],["1960s–70s",1960,1979],["1980s–90s",1980,1999],["2000–14",2000,2014],["2015+",2015,9999]];
const REGIONS = [...new Set(F.map(f => f.r))];
const PRIMED = ["vengeful ghost","serial killer","cult","possessing demon","person who died wronged","summoned by ritual","revenge","hunger","moving into a new home","must not look","cycle passes on","threat survives","threat destroyed","ambiguous","everyone dies","victim becomes threat","made by someone","unexplained","from nature","from outside","inherited"];
const primed = v => PRIMED.some(p => v === p || new RegExp("\\b" + p.replace(/s$/, "") + "s?\\b").test(v));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "" : n >= 1e6 ? "$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "m" : "$" + Math.round(n / 1e3) + "k";
const app = document.getElementById("app");
const cache = {};
const state = { q: "", region: new Set(), era: new Set(), has: new Set(), sort: "year", view: "graph", primary: "fears", glenses: new Set(["nightmares", "archetypes"]), lens: "nightmares", arrange: "net", colour: "plain" };
try { const s = JSON.parse(localStorage.getItem("bl-r1") || "{}"); if (s.sort) state.sort = s.sort; } catch (e) {}

function eraOf(y) { return ERAS.find(e => y >= e[1] && y <= e[2])[0]; }
const MARKS = [["P","plot","Wikipedia plot"],["S","sub","English subtitles"],["C","sp","Screenplay"],["J","sc","Jump-scare timings"],["V","st","Stills"]];
function thumb(f, cls) {
  if (!f.st) return `<span class="${cls} none">NO STILLS</span>`;
  return `<span class="${cls}" style="background-image:url('stills/${f.id}.jpg');background-size:100% ${f.st * 100}%;background-position:0 0"></span>`;
}

/* ---------- index ---------- */
function matches(f) {
  if (state.region.size && !state.region.has(f.r)) return null;
  if (state.era.size && !state.era.has(eraOf(f.y))) return null;
  for (const h of state.has) if (!f[h]) return null;
  const q = state.q.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/);
  const hay = [f.t, f.c, f.r, String(f.y), ...f.dir, ...f.cast, ...f.a.map(a => ARCH[a]?.name || "")].join(" ").toLowerCase();
  const hits = f.v.filter(v => terms.every(t => v.includes(t)));
  if (terms.every(t => hay.includes(t))) return hits;
  return hits.length ? hits : null;
}
function renderIndex() {
  document.title = "Bloodline Record";
  document.getElementById("crumb").textContent = "the fears that connect us";
  const counts = k => F.filter(f => f[k]).length;
  app.innerHTML = `
  <div class="controls">
    <div class="search">
      <button class="filterbtn" type="button" id="openf" aria-expanded="false" aria-controls="drawer">Filters<span class="k" id="fcount"></span></button>
      <input id="q" type="search" placeholder="Search a fear, a symbol or a film. Try mirror, drowned, Get Out" value="${esc(state.q)}" aria-label="Search fears, symbols and films">
      <span class="viewtoggle" role="group" aria-label="View"><button type="button" data-view="graph" aria-pressed="${state.view === "graph"}">Graph</button><button type="button" data-view="patterns" aria-pressed="${state.view === "patterns"}">Trends</button><button type="button" data-view="list" aria-pressed="${state.view === "list"}">List</button></span>
    </div>
  </div>
  <aside class="drawer" id="drawer" aria-label="Filters" inert>
    <div class="dhead"><h2>Filters</h2><button class="linkish" type="button" id="closef">Close</button></div>
    <p class="dnote">${state.view === "patterns" ? "Choosing eras narrows the region map; choosing regions narrows the era map." : `Films that don't match fade from the ${state.view === "graph" ? "graph" : "list"} as you choose.`}</p>
    <section><h3>Region</h3><div class="chips">${REGIONS.map(r => `<button class="chip" type="button" data-region="${esc(r)}" aria-pressed="${state.region.has(r)}">${esc(r)}${state.view === "patterns" ? "" : `<span class="k">${F.filter(f => f.r === r).length}</span>`}</button>`).join("")}</div></section>
    <section><h3>Era</h3><div class="chips">${ERAS.map(([e]) => `<button class="chip" type="button" data-era="${e}" aria-pressed="${state.era.has(e)}">${e}${state.view === "patterns" ? "" : `<span class="k">${F.filter(f => eraOf(f.y) === e).length}</span>`}</button>`).join("")}</div></section>
    ${state.view === "graph" ? `<section><h3>Arrange</h3><div class="chips">${[["net","By connection"],["time","Through time"]].map(([k, n]) => `<button class="chip" type="button" data-arrange="${k}" aria-pressed="${state.arrange === k}">${n}</button>`).join("")}</div></section>
    <section><h3>Veins</h3><div class="chips">${LENS.map(([k, n]) => `<button class="chip" type="button" data-glens="${k}" aria-pressed="${state.glenses.has(k)}"><span class="sw" style="background:${LENSC[k]};border-radius:50%;margin-right:6px"></span>${n}</button>`).join("")}</div></section>
    <section id="filmsopt" ${state.primary === "fears" ? "hidden" : ""}><h3>Films</h3><div class="chips">${[["plain","Plain"],["region","Ring by region"],["era","Shade by era"]].map(([k, n]) => `<button class="chip" type="button" data-colour="${k}" aria-pressed="${state.colour === k}">${n}</button>`).join("")}</div></section>`
    : `<section><h3>Sort</h3><div class="chips">${[["year","Year"],["title","Title"],["n","Most entries"]].map(([k, n]) => `<button class="chip" type="button" data-sort="${k}" aria-pressed="${state.sort === k}">${n}</button>`).join("")}</div></section>`}
    <div class="dfoot"><button class="btn" type="button" id="clearf">Clear filters</button></div>
  </aside>
  <div class="status"><span class="active"><span id="count"></span><span id="pills"></span></span>
    ${state.view === "patterns" ? "" : state.view === "graph" ? "" : ""}</div>
  ${state.view === "graph" ? `<div class="gstage" id="gstage"><div class="gbusy" role="status" aria-live="polite"><span class="geye" aria-hidden="true"><span class="lid"><i class="pupil"></i></span></span><span class="gbt">Charting</span></div>
    <div class="ghero" id="ghero"><p class="overline"><span class="nw">Bloodline</span> · <span class="nw">${F.length} films</span> · <span class="nw">${new Set(F.map(f => f.c)).size} countries</span> · <span class="nw">${Math.min(...F.map(f => f.y))} to ${Math.max(...F.map(f => f.y))}</span></p><h1>Every culture tells the same few <em>nightmares</em></h1><p>Different monsters, different languages, and underneath them the same fears. Every point of light is a film or a fear; every thread, a fear they share.</p></div><div class="ginfo" id="ginfo"></div><div class="gthreads" id="gthreads" role="group" aria-label="Veins shown"></div><div class="gmode viewtoggle" role="group" aria-label="Main nodes"><button type="button" data-primary="fears" aria-pressed="${state.primary === "fears"}">Fears</button><button type="button" data-primary="films" aria-pressed="${state.primary === "films"}">Films</button></div><div class="gzoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit" aria-label="Fit all">⤢</button></div></div>
    <div class="keyline" id="gkey" style="margin-top:10px"></div>` : state.view === "patterns" ? `<div class="pat" id="pat"></div>` : `<ol class="ledger" id="ledger"></ol>`}
  ${aboutBlock()}`;
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.q = q.value; renderRows(); });
  app.querySelectorAll("[data-region]").forEach(b => b.onclick = () => toggle(state.region, b.dataset.region, b));
  app.querySelectorAll("[data-era]").forEach(b => b.onclick = () => toggle(state.era, b.dataset.era, b));
  app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { if (b.dataset.view !== state.view) go(b.dataset.view === "graph" ? "" : b.dataset.view === "patterns" ? "trends" : b.dataset.view); });
  const drawer = document.getElementById("drawer"), openf = document.getElementById("openf");
  const setDrawer = open => { drawer.classList.toggle("open", open); document.body.classList.toggle("dopen", open);
    if (state.view === "graph") { clearTimeout(grt); grt = setTimeout(() => { G ? G.resize() : redraw(() => { buildGraph(); renderRows(); }); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 240); } open ? drawer.removeAttribute("inert") : drawer.setAttribute("inert", ""); openf.setAttribute("aria-expanded", open);
    if (open) document.getElementById("closef").focus(); else openf.focus(); };
  openf.onclick = () => setDrawer(!drawer.classList.contains("open"));
  document.getElementById("closef").onclick = () => setDrawer(false);
  document.onkeydown = e => { if (e.key === "Escape" && drawer.classList.contains("open")) setDrawer(false); };
  document.getElementById("clearf").onclick = () => { state.region.clear(); state.era.clear(); state.has.clear(); drawer.querySelectorAll("[data-region],[data-era],[data-has]").forEach(b => b.setAttribute("aria-pressed", "false")); renderRows(); };
  app.querySelectorAll("[data-arrange]").forEach(b => b.onclick = () => { state.arrange = b.dataset.arrange; app.querySelectorAll("[data-arrange]").forEach(x => x.setAttribute("aria-pressed", x === b)); G && redraw(() => G.arrange()); });
  app.querySelectorAll("[data-colour]").forEach(b => b.onclick = () => { state.colour = b.dataset.colour; app.querySelectorAll("[data-colour]").forEach(x => x.setAttribute("aria-pressed", x === b)); G && G.recolour(); });
  app.querySelectorAll("[data-glens]").forEach(b => b.onclick = () => { const k = b.dataset.glens; state.glenses.has(k) ? state.glenses.delete(k) : state.glenses.add(k); b.setAttribute("aria-pressed", state.glenses.has(k)); redraw(() => { buildGraph(); renderRows(); }); });
  app.querySelectorAll("[data-primary]").forEach(b => b.onclick = () => { state.primary = b.dataset.primary; app.querySelectorAll("[data-primary]").forEach(x => x.setAttribute("aria-pressed", x === b)); const fo = document.getElementById("filmsopt"); if (fo) fo.hidden = state.primary === "fears"; G && G.emphasis(); });
  app.querySelectorAll("[data-sort]").forEach(b => b.onclick = () => {
    state.sort = b.dataset.sort; try { localStorage.setItem("bl-r1", JSON.stringify({ sort: state.sort })); } catch (e) {}
    app.querySelectorAll("[data-sort]").forEach(x => x.setAttribute("aria-pressed", x === b)); renderRows(); });
  if (state.view === "graph") { G = null; redraw(() => { buildGraph(); renderRows(); }); } else renderRows();
}
function toggle(set, v, b) { set.has(v) ? set.delete(v) : set.add(v); b.setAttribute("aria-pressed", set.has(v)); renderRows(); }
function renderRows() {
  let list = F.map(f => [f, matches(f)]).filter(x => x[1]);
  const s = state.sort;
  list.sort((a, b) => s === "title" ? a[0].t.localeCompare(b[0].t) : s === "n" ? b[0].n - a[0].n : a[0].y - b[0].y || a[0].t.localeCompare(b[0].t));
  document.getElementById("count").textContent = `${list.length} of ${F.length} films`;
  const act = [...[...state.region].map(v => ["region", v]), ...[...state.era].map(v => ["era", v]), ...[...state.has].map(v => ["has", v])];
  const HASN = { st: "Stills", sp: "Screenplay", sc: "Jump scares", osub: "Original-language subtitles", pl: "Pilot lineage" };
  const fc = document.getElementById("fcount"); if (fc) fc.textContent = act.length || "";
  const pills = document.getElementById("pills");
  if (pills) { pills.innerHTML = act.map(([k, v]) => `<button class="pill" type="button" data-pk="${k}" data-pv="${esc(v)}" aria-label="Remove ${esc(k === "has" ? HASN[v] : v)}">${esc(k === "has" ? HASN[v] : v)} <b>×</b></button>`).join("");
    pills.querySelectorAll(".pill").forEach(b => b.onclick = () => { state[b.dataset.pk].delete(b.dataset.pv); document.querySelector(`[data-${b.dataset.pk}="${CSS.escape(b.dataset.pv)}"]`)?.setAttribute("aria-pressed", "false"); renderRows(); }); }
  if (state.view === "patterns") { renderPatterns(); return; }
  if (state.view === "graph") { G && G.filter(new Map(list.map(([f, h]) => [f.id, h]))); return; }
  const L = document.getElementById("ledger");
  if (!list.length) { L.innerHTML = `<li class="empty">No films match. Clear a filter or try another word.</li>`; return; }
  L.innerHTML = list.map(([f, hits]) => `<li class="row" tabindex="0" role="link" data-id="${f.id}" aria-label="${esc(f.t)}, ${f.y}">
    ${thumb(f, "thumb")}
    <span><div class="ti">${esc(f.t)}<span class="yrb">(${f.y})</span></div><div class="sub">${esc(f.c)}${f.dir.length ? " · " + esc(f.dir.join(", ")) : ""}</div>
      ${hits.length ? `<div class="hits"><span class="tag">matches</span> ${hits.slice(0, 5).map(h => `<b>${esc(h)}</b>`).join(", ")}${hits.length > 5 ? ` <span class="tag">+${hits.length - 5}</span>` : ""}</div>` : ""}</span>
  </li>`).join("");
  L.querySelectorAll(".row").forEach(r => {
    r.onclick = () => go(r.dataset.id);
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(r.dataset.id); } };

}

function aboutBlock() {
  return `<section class="about" id="about"><h2>How Bloodline works</h2><div class="cols">
    <div><h3>How it was made</h3>
      <p>Bloodline gathers close to five hundred horror films from every corner of the world and more than a century of cinema, with their plots, subtitles, screenplays and stills. Each film is read for what threatens, where it comes from, what it wants and how it ends, and every reading points back to the line it came from.</p>
      <p>Bloodline then trained a graph neural network on the threads between them. Nobody told it which films belong together. It found the nightmares on its own: a dozen stories that every culture keeps telling.</p></div>
    <div><h3>The veins</h3>
      <p>Each vein is one way the films run into each other. Switch them on and off on the graph.</p>
      <p><b style="color:${LENSC.nightmares}">Nightmares</b> are the overarching commonalities the graph model found: films that share the same mix of fears, wherever and whenever they were made.</p>
      <p><b style="color:${LENSC.archetypes}">Archetypes</b> are story shapes Bloodline classified, many rooted in folklore, such as the bad host or the woman who comes back. They are the one vein set from the top down, tagged on each film and then held up against what the films themselves show.</p>
      <p>${(() => { const ks = LENS.filter(([k]) => k !== "nightmares" && k !== "archetypes").map(([k, n], i) => `<b style="color:${LENSC[k]}">${i ? n.charAt(0).toLowerCase() + n.slice(1) : n}</b>`); return ks.slice(0, -1).join(", ") + " and " + ks[ks.length - 1]; })()} are read from each film's plot, subtitles and screenplay, each reading quoted. The many ways the films put these things are gathered into shared fears.</p></div>
    <div><h3>Rights</h3><p>Subtitles, screenplays and stills belong to their owners and are shown here for private research only. Wikipedia text is CC BY-SA; Wikidata facts are CC0.</p></div>
</div>
  </div></section>`;
}

/* ---------- trends ---------- */
const LENS = [["nightmares", "Nightmares"], ["archetypes", "Archetypes"], ["threat", "What threatens"], ["origin", "Where it comes from"], ["wants", "What it wants"], ["wrong", "The wrong underneath"], ["trigger", "What sets it off"], ["rules", "Rules"], ["who_suffers", "Who suffers"], ["ending", "How it ends"], ["images", "Symbols"]];
const LENSQ = { nightmares: "Which nightmare does it belong to?", threat: "What do we fear will come for us?", origin: "Where do we believe evil comes from?", wants: "What does the thing in the dark want?", wrong: "What buried wrong comes back?", trigger: "What opens the door?", rules: "What rules do we tell ourselves?", who_suffers: "Who does fear fall on?", ending: "How do we let the story end?", images: "What do we see when we're afraid?", archetypes: "Which old story is it retelling?" };
const RSHORT = { "North America": "N. America", "Continental Europe": "Europe", "UK & Ireland": "UK & Ire.", "East Asia": "E. Asia", "Southeast Asia": "SE Asia", "Latin America": "Lat. Am.", "South Asia": "S. Asia", "Australia & NZ": "Aus. & NZ", "Middle East & North Africa": "MENA", "Sub-Saharan Africa": "Africa" };
let PAT = null, patLoad = null;
function renderPatterns() {
  const el = document.getElementById("pat"); if (!el) return;
  if (!PAT) { el.innerHTML = `<p class="empty">Gathering the fears…</p>`; patLoad = patLoad || fetch("patterns.json").then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => { PAT = d; });
    patLoad.then(renderPatterns).catch(() => { el.innerHTML = `<p class="empty">The trends didn't load. Reload the page to try again.</p>`; patLoad = null; }); return; }
  const all = PAT.films, d = PAT.dims.includes(state.lens) ? state.lens : "nightmares", lc = LENSC[d];
  const pct = v => Math.round(v * 100) + "%", has = (f, lens, nm) => f.g[lens] && f.g[lens].f.includes(nm);
  const regs = [...new Set(all.map(f => f.r))].sort((x, y) => all.filter(f => f.r === y).length - all.filter(f => f.r === x).length);
  document.getElementById("count").textContent = `${all.length} films`;
  // the headline and the findings are always read across every film
  const W = ["North America", "Continental Europe", "UK & Ireland", "Australia & NZ"], A = ["East Asia", "Southeast Asia", "South Asia"];
  const part = (lens, nm, keep) => { const xs = all.filter(keep); return [xs.filter(f => has(f, lens, nm)).length, xs.length]; };
  const inR = g => f => g.includes(f.r), inE = e => f => eraOf(f.y) === e;
  const mir = [["Killers and captives", 0], ["The restless dead", 1]].filter(([nm]) => PAT.fears.nightmares?.[nm] !== undefined).map(([nm, i]) => ({ nm, i, w: part("nightmares", nm, inR(W)), a: part("nightmares", nm, inR(A)) }));
  const mmax = Math.max(...mir.flatMap(m => [m.w[0] / m.w[1], m.a[0] / m.a[1]]), .01);
  const mbar = (lab, [n, t], hi) => `<div class="mbar"><span>${lab}</span><span class="t"><i class="${hi ? "" : "dim"}" style="width:${n / t / mmax * 100}%"></i></span><b>${pct(n / t)}</b></div>`;
  const fl = (lens, nm) => PAT.fears[lens]?.[nm] !== undefined ? `<a class="pl" href="#${fearHash(lens, nm)}" style="--uc:${LENSC[lens]}">${esc(cap1(nm))}</a>` : esc(cap1(nm));
  const ca = part("nightmares", "Cults and curses", inE("<1960")), cb = part("nightmares", "Cults and curses", inE("2015+"));
  const ba = part("nightmares", "Blood drinkers", inE("<1960")), bb = part("nightmares", "Blood drinkers", inE("2015+"));
  const da = part("nightmares", "Doubles and impostors", inE("<1960")), db = part("nightmares", "Doubles and impostors", inE("2015+"));
  const ps = part("nightmares", "Possession", inR(["Southeast Asia"])), pa = part("nightmares", "Possession", () => true);
  const vs = part("archetypes", "The village needs blood", inR(["UK & Ireland"])), va = part("archetypes", "The village needs blood", () => true);
  const finds = [

    <ul class="plain" style="margin-top:10px">${d.scares.scares.slice(0, 8).map(s => `<li><span class="tag">${esc(s.t)}</span> ${esc(s.d)}</li>`).join("")}${d.scares.scares.length > 8 ? `<li class="small">and ${d.scares.scares.length - 8} more</li>` : ""}</ul>
    <p class="small" style="margin:8px 0 0">Crowd-sourced, from <a href="${esc(d.scares.source)}" target="_blank" rel="noopener">Where's the Jump</a>.</p></section>`;
  if (d.script) h += `<section><h4>Screenplay</h4><div class="stats"><div class="stat"><div class="n">${(d.script.words || 0).toLocaleString("en-GB")}</div><div class="l">words</div></div><div class="stat"><div class="n">${d.script.scene_headings ?? ""}</div><div class="l">scene headings</div></div>
    ${d.script.interior != null && d.script.scene_headings ? `<div class="stat"><div class="n">${Math.round(d.script.interior / d.script.scene_headings * 100)}%</div><div class="l">interior scenes</div></div>` : ""}${d.script.night_share != null ? `<div class="stat"><div class="n">${Math.round(d.script.night_share * 100)}%</div><div class="l">of timed scenes at night</div></div>` : ""}</div>
    <p class="small" style="margin:8px 0 0">${d.script.note ? esc(d.script.note) + " " : ""}A draft from <a href="${esc(d.script.source)}" target="_blank" rel="noopener">${esc(d.script.site)}</a>; it can differ from the finished film. Heading counts are approximate.</p></section>`;
  if (d.pilot) {
    const p = d.pilot;
    h += `<section><h4>Pilot lineage · hand-curated</h4><ul class="plain">${(p.lineage || []).map(l => `<li><div class="arch"><span class="nm">${esc(l.target)}</span></div><div class="small">${esc((l.relation || "").replace(/_/g, " "))} · ${esc(l.confidence)}</div>${l.evidence ? `<div class="small">${esc(l.evidence)}</div>` : ""}</li>`).join("")}</ul>
      ${(p.motifs || []).length ? `<h4 style="margin-top:14px">Motifs</h4><ul class="plain">${p.motifs.map(m => `<li>${esc(m.motif)} <span class="tag">${esc(m.confidence)}</span></li>`).join("")}</ul>` : ""}</section>`;
  }
  if (d.unusable.length) h += `<section><h4>Data quality</h4><ul class="plain">${d.unusable.map(u => `<li><span class="tag">${esc(u.file)}</span><div class="small">${esc(u.problem)}${u.use === "none" ? ", excluded" : ", used for quotes only"}. ${esc(u.reason || "")}</div></li>`).join("")}</ul></section>`;
  h += `<section><h4>Elsewhere</h4><ul class="plain">${[["Wikipedia", L.wikipedia], ["Wikidata", L.wikidata], ["IMDb", L.imdb], ["Letterboxd", L.letterboxd]].filter(x => x[1]).map(([n, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${n}</a></li>`).join("")}</ul></section>`;
  return h;
}
